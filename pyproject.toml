[project]
name = "video2text"
version = "0.1.0"
description = "Video/audio to text pipeline: VAD, ASR, video description, redundancy cleanup, summarization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "numpy>=1.26.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv.workspace]
members = [
    "webuis",
]
