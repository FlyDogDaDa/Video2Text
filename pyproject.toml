[project]
name = "video2text"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=17.1.0",
    "opencv-python-headless>=4.13.0.92",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "scipy>=1.18.0rc1",
    "soundfile>=0.14.0",
    "torch",
    "torchvision",
    "torchaudio",
    "transformers",
    "vllm[audio]",
    "scipy-stubs>=1.17.1.5",
    "silero-vad>=6.2.1",
]

[project.optional-dependencies]
audio = ["vllm[audio]"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
index-strategy = "unsafe-best-match"
prerelease = "allow"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[[tool.uv.index]]
name = "vllm-nightly"
url = "https://wheels.vllm.ai/nightly/cu130"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
vllm = { index = "vllm-nightly" }
