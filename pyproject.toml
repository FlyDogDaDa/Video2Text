[project]
name = "video2text"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "opencv-python-headless>=4.13.0.92",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "transformers",
    # "vllm",
    "vllm>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
[tool.uv]
# 限制解析環境為 Linux，避免 uv 去幫 macOS (darwin) 尋找不存的 CUDA 依賴
environments = ["sys_platform == 'linux'"]
index-strategy = "unsafe-best-match"
prerelease = "allow"

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"

[[tool.uv.index]]
name = "vllm-nightly"
url = "https://wheels.vllm.ai/nightly/cu129"
