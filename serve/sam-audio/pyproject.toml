[project]
name = "sam-audio-server"
version = "0.1.0"
description = "SAM-Audio speaker separation microservice"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "numpy",
    "sam-audio",
    "huggingface-hub>=0.20,<1.0",
]

[project.scripts]
start = "server:main"

[tool.uv.sources]
sam-audio = { git = "https://github.com/facebookresearch/sam-audio.git" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"