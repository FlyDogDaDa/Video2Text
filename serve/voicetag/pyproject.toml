[project]
name = "voicetag-server"
version = "0.1.0"
description = "VoiceTag speaker identification service for Video2Text"
requires-python = ">=3.10"
dependencies = [
    "voicetag[ml]>=0.2.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
]