[project]
name = "webuis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio",
    "huggingface-hub>=1.0",
    "pyannote-audio>=4.0",
    "pyyaml>=6.0.3",
    "torch>=2.13",
    "torchvision>=0.23",
    "torchcodec>=0.15",
    "voicetag[openai]>=0.2.0",
    "python-dotenv>=1.2.2",
    "librosa>=0.10.0",
    "numba>=0.59.0",
    "resemblyzer>=0.1.4",
    "setuptools>=77,<82",
]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
